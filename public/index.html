  <head>

    <link rel="icon" href="%PUBLIC_URL%/NARAlogoIcon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0A" />

    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>NARA</title>
    <script>
      (function(){var t=localStorage.getItem('nara_theme')||'dark';document.documentElement.setAttribute('data-theme',t);if(t==='light'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.content='#F5F3F0';}})();
    </script>
  </head>

    <div id="root"></div>
